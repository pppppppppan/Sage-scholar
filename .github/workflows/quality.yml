name: Offline quality
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      RERANKER_LOCAL_ONLY: 'true'
      OMP_NUM_THREADS: '1'
      OBSERVABILITY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-observability.txt
      - run: python -m pytest -q tests/test_observability.py
      - run: python -m pytest -q tests/test_section_lookup.py tests/test_reranker.py tests/test_evals.py tests/test_eval_quality.py tests/test_persistent_retrieval.py tests/test_router.py tests/test_router_policy_v2.py tests/test_semantic_query_graph.py
      - run: python -m evals validate --dataset evals/datasets/gold/rag.jsonl
      - run: python -m evals run --suite all --gate evals/gate_configs/offline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-eval
          path: eval-results/
