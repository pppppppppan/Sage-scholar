name: sage-scholar

services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
      args:
        INSTALL_VISUAL: ${SAGE_DOCKER_VISUAL:-false}
    init: true
    restart: unless-stopped
    env_file: .env.docker
    environment:
      SAGE_DATA_DIR: /app/data
      SAGE_CONFIG_DIR: /app/deploy/configs
      HF_HOME: /home/sage/.cache/huggingface
      XDG_CACHE_HOME: /home/sage/.cache
      TMPDIR: /app/data/tmp
      NO_PROXY: localhost,127.0.0.1,::1,backend,frontend,ollama,host.docker.internal
      no_proxy: localhost,127.0.0.1,::1,backend,frontend,ollama,host.docker.internal
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - sage-data:/app/data
      - model-cache:/home/sage/.cache
      - sage-logs:/app/logs
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 90s
    stop_grace_period: 60s

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    init: true
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${SAGE_BIND_ADDRESS:-127.0.0.1}:${SAGE_WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    stop_grace_period: 20s

  ollama:
    image: ollama/ollama:0.40.3
    profiles: [ollama]
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
    stop_grace_period: 30s

volumes:
  sage-data:
  model-cache:
  sage-logs:
  ollama-models:
